<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <div id="chat-widget">
      <button id="chat-launcher" type="button" aria-label="Open chat">
        <div id="chat-launcher-label">Ask us</div>
        <div id="chat-launcher-badge" class="hidden" aria-label="Unread messages"></div>
        <svg id="chat-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <svg id="chat-close-icon" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div id="chat-popup" class="hidden" role="dialog" aria-modal="false" aria-label="Support chat">
        <div id="chat-header">
          <div id="chat-header-left">
            <div id="chat-avatar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div id="chat-header-info">
              <div id="chat-title">Support</div>
              <div id="chat-status">
                <span id="chat-status-dot"></span>
                <span>We typically reply instantly</span>
              </div>
            </div>
          </div>
          <button id="chat-close" type="button" aria-label="Close chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div id="chat-messages" aria-live="polite">
          <div id="chat-welcome">
            <div id="welcome-icon">👋</div>
            <div id="welcome-title">Hi there!</div>
            <div id="welcome-text">How can we help you today?</div>
          </div>
        </div>

        <form id="chat-form">
          <div id="chat-input-container">
            <div id="chat-input-row">
              <input id="chat-text" type="text" placeholder="Type your message..." autocomplete="off" />
              <label id="chat-file-label" for="chat-file" title="Attach file">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
              </label>
              <input id="chat-file" type="file" accept=".png,.jpg,.jpeg,.pdf" />
              <button id="chat-send" type="submit" title="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
            <div id="chat-file-hint"></div>
          </div>
        </form>
      </div>
    </div>
    <script src="chat.js"></script>
    <script src="track.js"></script>
  </body>
</html>
